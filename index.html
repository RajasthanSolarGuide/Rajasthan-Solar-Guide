
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rajasthan Solar Guide - Admin</title>
<style>
body{margin:0;background:#f1f7f2;font-family:Arial,sans-serif;color:#222}
header{background:#087b45;color:white;text-align:center;padding:20px}
main{max-width:700px;margin:20px auto;padding:15px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 10px #0001}
input,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border-radius:7px;font-size:16px}
input{border:1px solid #ccc}
button{background:#087b45;color:white;border:0;font-weight:bold}
button:disabled{opacity:.6}
.customer{border-top:1px solid #ddd;padding:12px 0;line-height:1.7}
small{color:#666}
</style>
</head>
<body>
<header>
<h2>Rajasthan Solar Guide</h2>
<p>Admin Panel</p>
</header>

<main>
<div class="card" id="loginBox">
<h3>Admin Login</h3>
<p>केवल अधिकृत Admin लॉगिन करें।</p>
<input id="email" type="email" value="surgyanmeena145@gmail.com" readonly>
<input id="password" type="password" placeholder="Firebase Password">
<button id="loginBtn">Login करें</button>
<p id="message"></p>
</div>

<div class="card" id="dashboard" hidden>
<h3>ग्राहकों की Registration</h3>
<p id="count">लोड हो रहा है...</p>
<button id="refreshBtn">Refresh करें</button>
<div id="customers"></div>
<button id="logoutBtn">Logout</button>
</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAlosbBNsfb1s01Pzx-YKXXL5IZLgRB7jo",
authDomain:"rajasthan-solar-guide-f21c6.firebaseapp.com",
projectId:"rajasthan-solar-guide-f21c6",
storageBucket:"rajasthan-solar-guide-f21c6.firebasestorage.app",
messagingSenderId:"1044592107049",
appId:"1:1044592107049:web:2d06c0497a640f81aac638",
measurementId:"G-M1NK9R147R"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const ADMIN_UID="bf3GhNSpTjUzv7b37B2vWFPi4Iw1";
const loginBox=document.getElementById("loginBox");
const dashboard=document.getElementById("dashboard");
const message=document.getElementById("message");

document.getElementById("loginBtn").onclick=async()=>{
message.textContent="Login हो रहा है...";
try{
await signInWithEmailAndPassword(
auth,
"surgyanmeena145@gmail.com",
document.getElementById("password").value
);
}catch(e){
message.textContent="Login नहीं हुआ। Password या Firebase Authentication जाँचें।";
}
};

onAuthStateChanged(auth,async(user)=>{
if(user && user.uid===ADMIN_UID){
loginBox.hidden=true;
dashboard.hidden=false;
await loadCustomers();
}else{
dashboard.hidden=true;
loginBox.hidden=false;
}
});

async function loadCustomers(){
const area=document.getElementById("customers");
area.textContent="जानकारी लोड हो रही है...";
try{
const q=query(collection(db,"registrations"),orderBy("createdAt","desc"));
const result=await getDocs(q);
document.getElementById("count").textContent="कुल ग्राहक: "+result.size;
area.innerHTML="";
if(result.empty){
area.textContent="अभी कोई Registration नहीं है।";
return;
}
result.forEach((doc)=>{
const c=doc.data();
const item=document.createElement("div");
item.className="customer";
const fields=[
["नाम",c.name],["मोबाइल",c.mobile],["जिला",c.district],
["तहसील",c.tehsil],["गाँव",c.village],["सोलर",c.kw],
["पता",c.address],["बिजली बिल",c.bill]
];
fields.forEach(([label,value])=>{
const line=document.createElement("div");
line.textContent=label+": "+(value??"");
item.appendChild(line);
});
area.appendChild(item);
});
}catch(e){
area.textContent="जानकारी नहीं खुली। Firestore Security Rules की जाँच जरूरी है।";
console.error(e);
}
}

document.getElementById("refreshBtn").onclick=loadCustomers;
document.getElementById("logoutBtn").onclick=()=>signOut(auth);
</script>
</body>
</html>
